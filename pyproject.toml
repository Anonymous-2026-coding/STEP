[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "step-demo"
version = "0.1.0"
description = "Minimal WT dynamics and in silico perturbation demo for STEP"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[tool.setuptools]
package-dir = {"" = "src"}
