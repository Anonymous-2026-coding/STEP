[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "step-spatiotemporal"
version = "0.3.0"
description = "Neural STEP: WT snapshot dynamics and decoder-consistent gene editing"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "h5py>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
step = "step.cli:main"
